name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, static analysis & unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4', '8.5' ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3

      - name: PHPCS (WPCS + PHPCompatibility)
        run: composer run lint

      - name: PHPStan (level 8)
        run: composer run analyze

      - name: Unit tests (no WordPress bootstrap)
        run: composer run test

  integration-e2e:
    name: Integration + E2E (wp-env)
    runs-on: ubuntu-latest
    steps:
      # Map into a fixed directory name so wp-env mounts the plugin at
      # wp-content/plugins/wc-reso-ordini, matching the hard-coded --env-cwd used by the
      # integration command and the e2e seeder.
      - uses: actions/checkout@v4
        with:
          path: wc-reso-ordini

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wc-reso-ordini/package-lock.json

      - name: Install Composer dependencies (plugin runtime + dev)
        uses: ramsey/composer-install@v3
        with:
          working-directory: wc-reso-ordini

      - name: Install npm dependencies
        working-directory: wc-reso-ordini
        run: npm ci

      - name: Build assets (frontend block + React admin)
        working-directory: wc-reso-ordini
        run: npm run build

      - name: Start wp-env (WordPress + WooCommerce)
        working-directory: wc-reso-ordini
        run: npm run env:start

      - name: Integration tests (PHPUnit in wp-env)
        working-directory: wc-reso-ordini
        run: >-
          npx wp-env run tests-cli --env-cwd=wp-content/plugins/wc-reso-ordini
          php -d memory_limit=512M ./vendor/bin/phpunit -c phpunit-integration.xml.dist

      - name: Install Playwright Chromium
        working-directory: wc-reso-ordini
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Playwright + axe)
        working-directory: wc-reso-ordini
        env:
          CI: 'true'
        run: npm run test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: wc-reso-ordini/artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop wp-env
        if: always()
        working-directory: wc-reso-ordini
        run: npm run env:stop

  plugin-check:
    name: WordPress Plugin Check (distribution build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Build distribution package (no-dev vendor, dist excludes)
        run: bash bin/build-dist.sh

      - name: Unpack the distribution build
        run: |
          mkdir -p pc-build
          unzip -q dist/erred-eu-order-withdrawal-for-woocommerce.zip -d pc-build

      - name: Run Plugin Check on the built plugin
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./pc-build/erred-eu-order-withdrawal-for-woocommerce
